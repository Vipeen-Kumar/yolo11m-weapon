[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "error"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = false
pythonVersion = "3.11"

[client]
toolbarMode = "viewer"
maxMessageSize = 200

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[deprecation]
showPyplotGlobalUse = false

[runner]
magicEnabled = false

[logger]
level = "error"

# Optimize for cloud deployment
[client.showErrorDetails]
showErrorDetails = false
